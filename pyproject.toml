[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "godot-ship-kit"
version = "0.1.0"
description = "Take a Godot 4 game from repo to a Play-ready Android build: doctor, slim, build, and headless screenshot diffs your coding agent can read."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vladislav Y" }]
keywords = ["godot", "godot4", "android", "google-play", "gamedev", "aab", "apk", "visual-regression", "agent-skills", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
eyes = ["pillow>=10", "numpy>=1.26"]
dev = ["pillow>=10", "numpy>=1.26", "pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
gsk = "godot_ship_kit.cli:main"

[project.urls]
Homepage = "https://github.com/vladosskins178/godot-ship-kit"
Issues = "https://github.com/vladosskins178/godot-ship-kit/issues"
Changelog = "https://github.com/vladosskins178/godot-ship-kit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_ship_kit"]

[tool.hatch.build.targets.wheel.force-include]
"skills/godot-ship-kit/SKILL.md" = "godot_ship_kit/skill/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "AGENTS.md", "AUDIT.md"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"src/godot_ship_kit/eyes/report.py" = ["E501"]  # inline HTML/CSS template

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["godot: needs a Godot 4 binary (set GODOT) and xvfb"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/godot_ship_kit"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true
