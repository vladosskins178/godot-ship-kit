name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not godot"

  godot:
    name: End-to-end with Godot 4.6.3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The repository is also a GitHub Action; this exercises it as users would.
      - name: Set up Godot and gsk
        uses: ./
        with:
          args: --version
      - name: Import the sample project
        run: $GODOT --headless --path examples/hello-ship --import

      - name: gsk doctor (no Android SDK on this runner, so errors are expected)
        run: gsk doctor examples/hello-ship --verbose || true
      - name: gsk slim
        run: gsk slim examples/hello-ship
      - name: gsk play-checklist
        run: gsk play-checklist examples/hello-ship > /dev/null
      - name: gsk eyes against the committed references
        run: gsk eyes examples/hello-ship --display xvfb

      - run: pip install --quiet -e ".[dev]"
      - name: End-to-end tests
        run: pytest -m godot

      - name: Upload the eyes report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eyes-report
          path: examples/hello-ship/.gsk/eyes

  capture-compat:
    name: Capture script on Godot ${{ matrix.godot }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.2.2", "4.4.1", "4.5.1"]
    steps:
      - uses: actions/checkout@v4
      # References are made with 4.6, so older versions only have to capture cleanly:
      # --update exits non-zero if any shot fails or the capture script does not load.
      - uses: ./
        with:
          godot-version: ${{ matrix.godot }}
          args: eyes examples/hello-ship --display xvfb --update
